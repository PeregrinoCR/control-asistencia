# Publicación en Netlify. Las claves de Supabase se ponen en Netlify:
# Site configuration › Environment variables (VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY).
[build]
  command = "npm run build"
  publish = "dist"
  # Netlify quedó en desuso (la app se publica en Cloudflare Pages): no construir para no gastar créditos.
  # Para volver a usarlo, quite la línea siguiente.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

# La app maneja sus propias rutas (/entrar, /direccion…): todas abren index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
